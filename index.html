ecke."],["Im Gewerbehof","Mittwoch. Die Wege werden länger, die Kisten schwerer. Robin schreibt ins Betriebsteam: „In der Kantine bitte hinten klingeln. Vorne wartet ihr bis morgen.“"],["Auf der Höhe","Donnerstag. Gegenwind auf der letzten Steigung. Am Treff wird schon Platz im Regal gemacht. Jetzt zählt, was du tatsächlich noch transportieren kannst."],["Die Schlussrunde","Robin ruft an: „In der Kantine steht noch eine ganze Lieferung. Danach machen sie übers Wochenende zu. Schau erst nach deinen Vorräten, bevor du zusagst.“"]],"encounters":[{"name":"Sechs Körbe, eine schmale Hintertür","opening":"Bäckerin Ute hält die Tür mit dem Fuß auf. „Die blauen Körbe bleiben hier. Bitte umpacken, bevor der Fahrer kommt.“","pressure":"Ute muss zum Lieferwagen. Der Durchgang muss frei werden.","recover":"Ute nimmt ein Telefonat an. Du kannst ungestört weiterpacken.","hit":"Ein Korb verkantet im Türrahmen. Das kostet Kraft.","done":"Die Körbe stehen wieder im Regal. Ute zählt nach und gibt dir die Brote mit."},{"name":"Sortieren unter der Marktplane","opening":"Händler Cem klappt die Plane herunter. „Die Beeren bitte einzeln durchsehen. In der hinteren Kiste sind ein paar hinüber.“","pressure":"Der Wind drückt Regen unter die Plane.","recover":"Cem sichert die Plane. Du hast beide Hände zum Sortieren frei.","hit":"Du musst die Kisten erneut umsetzen; dein Rücken meldet sich.","done":"Die beschädigten Beeren sind aussortiert. Cem schiebt dir die geprüfte Ware zu."},{"name":"Die Kühltheke macht Feierabend","opening":"Mara aus der Spätschicht zeigt auf die Kühlwagen. „Ich brauche die Wagen zurück. Könnt ihr direkt hier in eure Boxen packen?“","pressure":"Mara räumt den nächsten Wagen aus dem Gang.","recover":"Die nächste Palette hängt noch an der Rampe. Kurz kein Nachschub.","hit":"Du läufst noch einmal zur Abholtasche. Die zusätzliche Runde zehrt.","done":"Die Wagen sind leer und die Ware ist verpackt. Mara schließt die Lagertür."},{"name":"Eine Torte passt nicht quer","opening": r Aufnäher ist abgetrennt; die Polster sind noch gut.","hi_vis_suit":"Viel Stoff für eine lange Rampenschicht.","work_overall":"Die verstärkten Nähte halten auch die Rollregalrunde aus.","cool_bag":"Mit Kühlelementen bestückt. Leichter als die große Box.","cargo_crate":"Sauber, lebensmittelecht und mit passenden Griffen.","insulated_box":"Die Einsätze halten Schachteln auseinander.","bike_panniers":"Links und rechts gleichmäßig packen.","folding_cart":"Hannes hat das klappernde Rad ersetzt.","food_backpack":"Getrennte Fächer für Kleinteile und verpackte Ware.","soap":"Am Waschplatz zusammen mit Wasser benutzen.","wash_kit":"Wasser, Seife und sauberes Tuch für eine Spielrunde.","clean_towel":"Kommt sauber verpackt aus der Treffküche.","cleaning_wipes":"Für Arbeitsmaterial und Hände im abstrakten Spielmodell.","garbage_bags":"Die Sortierrunde bleibt übersichtlich; für Lebensmittel ungeeignet.","odor_sachet":"Eine erfundene Spielhilfe gegen Geruchsbelastung, kein Atemschutz.","ice_pack":"Kühlt die Ladung im Spiel vier Runden. Macht eine unterbrochene Kühlkette nicht rückgängig.","cooling_set":"Für eine längere Runde zwischen zwei Kühlschränken.","repair_tape":"Im Spiel werden damit die gerade angelegten verschlissenen Teile ausgebessert.","repair_kit":"Ein paar Minuten Aufmerksamkeit für beanspruchtes Material.","spare_filters":"Im Spiel nur für den Gesichtsslot; keine echte Filterfreigabe.","fresh_gloves":"Füllt im Spiel die Haltbarkeit des angelegten Handschuhpaars auf.","ginger_tea":"Scharf, warm und im Spiel beruhigend.","still_water":"Ein Liter, den du nicht erst am Laden suchen musst.","sparkling_water":"Löscht Durst, bringt im Spiel aber auch etwas Bauchgas.","fruit_tea":"Eine zweite Thermoskanne aus der Treffküche.","coffee_flask":"Für ein kurzes Hoch mit einem kleinen Preis am Magen.","route_note":"Du liest die Änderungen noch einmal; Übersicht für die nächsten Aufgaben.","stretch_card":"Eine Karte mit einer freiwilligen Pausenroutine. Der Bonus ist reine Spie <script>/* Portable game rules. No DOM, network, dependencies, eval, or Python runtime. */
(function(root) {
  'use strict';
  function createEngine(D) {
    const has=(obj,key)=>Object.prototype.hasOwnProperty.call(obj,key);
    const I=D.items, slots=D.slots, clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
    const copy=v=>JSON.parse(JSON.stringify(v));
    const mod=v=>Math.floor((v-10)/2);
    function rand(r) { // Serializable Mulberry32 stream; browser seeds are independent of Python's RNG.
      r.rng=(r.rng+0x6D2B79F5)>>>0;
      let t=r.rng;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    }
    const roll=(r,n)=>1+Math.floor(rand(r)*n);
    const pick=(r,a)=>a[Math.floor(rand(r)*a.length)];
    function sample(r,a,n) { const x=[...a];for(let j=x.length-1;j>0;j--){const k=Math.floor(rand(r)*(j+1));[x[j],x[k]]=[x[k],x[j]];}return x.slice(0,n); }
    function weighted(r,a) {const weights={Gewöhnlich:8,Selten:4,Episch:2,Legendär:1};let t=rand(r)*a.reduce((s,k)=>s+weights[I[k].rarity],0);return a.find(k=>(t-=weights[I[k].rarity])<0)||a[a.length-1];}
    function note(r,text){r.log.push(text);r.log=r.log.slice(-120);}
    function add(r,key){if(!I[key])return null;const o={uid:++r.serial,key,age:0,cold_chain_ok:true};if(I[key].durability)o.durability=I[key].durability;r.inventory.push(o);return o.uid;}
    function attrRoll(r) {const rng={rng:(r.seed^Math.imul(r.rerolls+1,0x9E3779B9))>>>0};r.attributes={};r.attribute_dice={};for(const k of Object.keys(D.attributes)){const ds=Array.from({length:4},()=>roll(rng,6));r.attribute_dice[k]=ds;r.attributes[k]=[...ds].sort((a,b)=>b-a).slice(0,3).reduce((a,b)=>a+b,0);}}
    function newRun(seed=42) {
      const r={seed:Number(seed)>>>0,rng:Number(seed)>>>0,phase:'creation',day:1,step:0,turn:0,hp:100,energy:85,water:85,fullness:20,nausea:0,xp:0,level:1,
        rescued:0,shared:0,fairteiler_shared:0,wins:0,inventory:[],equipped:{},serial:0,log:['Die fünftägige Rettungstour beginnt.'],options:[],enemy:null,loot:[],combat:[],
        rerolls:0,character_name:'Alex',background:null,last_check:null,hygiene:100,gas:0,urgency:0,salt_load:0,digestion:[],effects:{},last_retch:-10,
        trust:50,business_pickups:0,responsible_choices:0,violations:[],claimed:[],supported_days:[],standing:{},hygiene_log:[],distribution_log:[],basket:null};
      for(const key of ['baguette','apron','tote','water','tea','bandage','banana','bread']){const id=add(r,key);if(slots[I[key].kind])r.equipped[I[key].kind]=id;}
      for(const key of ['cotton_gloves','cloth_mask','soap'])add(r,key);
      attrRoll(r);makeOptions(r);return r;
    }
    const object=(r,uid)=>r.inventory.find(o=>o.uid===Number(uid));
    const worn=(r,o)=>Object.values(r.equipped).includes(o.uid);
    function bonus(r,key){let n=r.inventory.filter(o=>worn(r,o)&&(o.durability??1)>0).reduce((s,o)=>s+(I[o.key][key]||0),0);const e=r.effects[key];return n+(e&&r.turn<e.until?e.power:0);}
    function stats(r){return {attack:7+2*(r.level-1)+bonus(r,'attack'),defense:bonus(r,'defense'),capacity:18+mod(r.attributes.strength||10)*2+bonus(r,'capacity'),cooling:bonus(r,'cooling')};}
    const weight=r=>r.inventory.reduce((s,o)=>s+I[o.key].weight,0);
    const freshness=o=>Math.max(0,(I[o.key].shelf??999)-o.age)<1e-9?0:Math.max(0,(I[o.key].shelf??999)-o.age);
    function chance(b,dc){let n=0;for(let f=1;f<=20;f++)if(f===20||(f!==1&&f+b>=dc))n++;return n*5;}
    function preview(r,attribute,dc){let tool=0;const o=object(r,r.equipped.weapon);if(o&&(o.durability??1)>0){const b=D.toolBonuses[o.key];if(b&&b[0]===attribute)tool=b[1];}
      const p={attribute,dc,base:mod(r.attributes[attribute]||10),tool,equipment:bonus(r,attribute),fatigue:r.energy<25?-2:0,stomach:r.nausea>=50?-2:0,community:attribute==='presence'?(r.trust>=70?1:r.trust<25?-1:0):0};
      p.bonus=p.base+p.tool+p.equipment+p.fatigue+p.stomach+p.community;p.chance=chance(p.bonus,dc);return p;}
    function spec(r,action,option=r.encounter||{}){const danger=option.danger||1;if(action==='attack')return preview(r,option.kind==='business'?D.venueStats[option.venue]:'dexterity',10+danger-(option.kind==='business'&&(r.standing[option.venue]||0)>=2?1:0));
      if(action==='heavy')return preview(r,'strength',13+danger);if(action==='defend')return preview(r,'dexterity',12);if(action==='flee')return preview(r,'presence',14);
      if(action==='bin'){const b=D.bins[r.bin_key];return preview(r,b.stat,b.dc);}return preview(r,r.event==='rain'?'dexterity':'strength',14);}
    function resolve(r,p){const f=roll(r,20);r.last_check={...p,roll:f,total:f+p.bonus,success:f===20||(f!==1&&f+p.bonus>=p.dc)};note(r,summary(r.last_check));return r.last_check.success;}
    const signed=n=>n>=0?'+'+n:String(n);
    function summary(c){return `${D.attributes[c.attribute]}: W20 ${c.roll} ${signed(c.bonus)} = ${c.total} gegen SG ${c.dc} → ${c.success?'Erfolg':'Misserfolg'}${c.roll===1?' (natürliche 1)':c.roll===20?' (natürliche 20)':''}`;}
    function end(r){r.hp=Math.min(100+(r.level-1)*8,r.hp);if(r.hp<=0){r.hp=0;r.phase='dead';note(r,'Für heute reicht die Kraft nicht mehr. Das Betriebsteam organisiert Ersatz.');}}
    function tick(r){const s=stats(r),save=bonus(r,'energy_save'),dig=bonus(r,'digestion');r.turn++;r.energy=Math.max(0,r.energy-Math.max(1,3-save));r.water=Math.max(0,r.water-3);r.fullness=Math.max(0,r.fullness-5);r.nausea=Math.max(0,r.nausea-2);
      for(const o of r.inventory){if(I[o.key].cold&&!s.cooling)o.cold_chain_ok=false;o.age+=I[o.key].cold&&s.cooling?1/3:1;}
      if(r.salt_load>=10)r.water=Math.max(0,r.water-1);r.salt_load=Math.max(0,r.salt_load-1);
      if(r.digestion.length){const m=r.digestion[0],a=Math.min(m.energy,Math.max(1,4+dig-(m.fat>=5?1:0)));m.energy-=a;r.energy=clamp(r.energy+a);r.urgency=clamp(r.urgency+3);if(m.energy<=0)r.digestion.shift();}
      r.gas=Math.max(0,r.gas-2);if(r.gas>=60)r.nausea=clamp(r.nausea+2);if(r.urgency>=80)r.energy=Math.max(0,r.energy-2);
      if(r.nausea>=90&&r.fullness>0&&r.turn-r.last_retch>=4){r.fullness=Math.max(0,r.fullness-30);r.water=Math.max(0,r.water-12);r.nausea=Math.max(0,r.nausea-20);r.last_retch=r.turn;note(r,'Der Spielmagen rebelliert: −30 Füllung, −12 Wasser, −20 Übelkeit.');}
      for(const o of r.inventory)if(worn(r,o)&&o.durability>0){o.durability--;if(!o.durability)note(r,I[o.key].name+' ist verschlissen.');}
      for(const k of Object.keys(r.effects))if(r.effects[k].until<=r.turn)delete r.effects[k];
      if(!r.energy||!r.water){r.hp-=6;note(r,'Erschöpfung oder Durst: −6 Kraft.');}if(r.nausea>=70){r.hp-=5;note(r,'Magenkrämpfe: −5 Kraft.');}if(weight(r)>s.capacity)r.energy=Math.max(0,r.energy-5);end(r);
    }
    const reserved=(r,uid)=>!!r.basket&&r.basket.uids.includes(Number(uid));
    function equip(r,uid){const o=object(r,uid);if(r.phase!=='map'||!o||!slots[I[o.key].kind])return false;r.equipped[I[o.key].kind]=o.uid;note(r,I[o.key].name+' angelegt.');return true;}
    function consume(r,uid){const o=object(r,uid);if(!['map','combat'].includes(r.phase)||!o||reserved(r,o.uid))return false;const d=I[o.key];if(!['food','consumable'].includes(d.kind))return false;let e=d.energy||0;

    // Validate imported saves before they can affect the live session. No executable data.
    function validate(s){const bad=()=>{throw new Error('Unbekannter oder beschädigter Spielstand.');};

      const numeric=['seed','rng','day','step','turn','hp','energy','water','fullness','nausea','xp','level','rescued','shared','fairteiler_shared','wins','serial','rerolls','hygiene','gas','urgency','salt_load','last_retch','trust','business_pickups','responsible_choices'];

      if(!plain(r.attributes)||Object.keys(D.attributes).some(k=>!Number.isInteger(r.attributes[k])||r.attributes[k]<3||r.attributes[k]>20)||!plain(r.equipped)||!plain(r.effects)||!plain(r.standing))bad();

      for(const o of r.options)if(!['business','camp','event','arena','bins'].includes(o.kind)||o.kind==='business'&&(!Number.isInteger(o.venue)||!D.businesses[o.venue])||!Number.isInteger(o.danger)||o.danger<1||o.danger>3)bad();

  function inventoryCards(r){const list=r.inventory.filter(o=>(ui.bagCategory==='all'||D.items[o.key].kind===ui.bagCategory)&&D.items[o.key].name.toLocaleLowerCase('de').includes(ui.bagSearch.toLocaleLowerCase('de')));
    if(!list.length)return '<p class="muted">Keine passenden Gegenstände im Rucksack.</p>';return list.map(o=>{const d=D.items[o.key],worn=Object.values(r.equipped).includes(o.uid),reserved=G.reserved(r,o.uid);return `<article class="card item" data-item="${o.uid}"><div class="title">${rarity[d.rarity]} ${esc(d.name)} ${worn?'<span class="tag">angelegt</span>':''}</div><p>${esc(D.flavour[o.key])}</p><p class="muted">${esc(kinds[d.kind])} · ${d.rarity} · Gewicht ${d.weight}<br>${esc(description(d))}</p>${d.durability?progress(o.durability,d.durability,'Zustand '+o.durability+'/'+d.durability)+(o.durability===0?alert('Verschlissen: keine Boni bis zur Reparatur.','warn'):''):''}${reserved?alert('Für den Essenskorb reserviert. Zum Essen oder Ablegen zuerst zurücknehmen.'):''}${d.kind==='food'?`<p class="muted">Frische: ${G.freshness(o).toFixed(1)} Spielrunden. ${d.cold&&!o.cold_chain_ok?'Kühlkette länger unterbrochen; keine Weitergabe.':''}</p>`:''}<div class="row">${D.slots[d.kind]?button('Anlegen','equip',{uid:o.uid},worn||r.phase!=='map'):button(d.kind==='food'?'Essen':'Benutzen','consume',{uid:o.uid},reserved||!['map','combat'].includes(r.phase))}${button('Ablegen','drop',{uid:o.uid},reserved||worn||r.phase!=='map')}</div></article>`;}).join('');}
  function bag(r){const s=G.stats(r);return stats(r)+`<section class="card"><h2>Was dein Körper gerade mitmacht</h2><div class="grid2">${progress(r.hygiene,100,'Handhygiene '+r.hygiene+'/100')}${progress(r.gas,100,'Bauchgas '+r.gas+'/100')}${progress(r.urgency,100,'Toilettendrang '+r.urgency+'/100')}</div><p>Noch ${r.digestion.reduce((n,m)=>n+m.energy,0)} Energie in Verdauung · Salzlast ${r.salt_load}/50</p>${r.digestion.length?`<p>In Verdauung: ${esc(r.digestion.map(m=>m.name).join(', '))}</p>`:''}<p class="muted">Nahrung liefert ein Drittel Energie sofort, den Rest rundenweise. Fett verlangsamt die Freigabe, Ballaststoffe erhöhen Spiel-Bauchgas, Salz erhöht den Wasserverbrauch. Schmutzige Hände steigern den Magenreiz.</p><div class="actions">${button('Hände am Waschplatz waschen','body',{move:'wash'},r.phase!=='map'||r.water<8||r.hygiene===100)}${button('Toilettenpause einlegen','body',{move:'restroom'},r.phase!=='map'||!r.urgency&&!r.gas&&!r.nausea)}</div><small>Waschen: −5 Wasser plus Runde. Toilettenpause: Drang 0, −25 Gas, −10 Übelkeit plus Runde. Fiktives Spielmodell.</small><details><summary>Aktive Effekte</summary>${Object.entries(r.effects).map(([k,e])=>`<p>${esc(effectNames[k]||k)} ${G.signed(e.power)} · noch ${Math.max(0,e.until-r.turn)} Runden</p>`).join('')||'<p>Keine zeitweiligen Effekte.</p>'}<small>Gleiche Effekte werden erneuert, nicht unbegrenzt gestapelt.</small></details></section><details open><summary>Angelegte Ausrüstung · sieben Plätze</summary>${Object.entries(D.slots).map(([k,label])=>{const o=r.inventory.find(x=>x.uid===r.equipped[k]);return `<div class="slot"><span><strong>${esc(label)}:</strong> ${esc(o?D.items[o.key].name:'frei')}</span>${o?button('Abnehmen','unequip',{slot:k},r.phase!=='map','small'):''}</div>`;}).join('')}</details><h2>Rucksack</h2><p class="muted">Traglast ${G.weight(r)}/${s.capacity} · ${s.attack} Tempo · ${s.defense} Entlastung · Kühlung ${s.cooling?'an':'aus'}</p><div class="filters"><label>Kategorie<select data-view="bagCategory">${options(['all',...Object.keys(kinds)],ui.bagCategory,{all:'Alle',...kinds})}</select></label><label>Im Rucksack suchen<input type="search" data-view="bagSearch" value="${esc(ui.bagSearch)}"></label></div><div id="inventory-list" class="cards">${inventoryCards(r)}</div>`;}
  function district(r){return `<h2>Bezirkstreffen · Sam (BOT) & Robin (BV)</h2><p>Sam organisiert als Botschafterin den Austausch im Stammbezirk. Robin koordiniert als betriebsverantwortliche Person die Abholtermine mit den Betriebsteams.</p><p class="muted">Zusammenhalt und Materialboni sind erfundene RPG-Werte, keine offizielle Bewertung bei foodsharing.</p>${progress(r.trust,100,'Zusammenhalt (Spielwert) '+r.trust+'/100')}${alert(r.trust>=70?'Sam: „Auf deine Absprachen konnten wir uns verlassen.“ +1 auf Auftreten-Proben.':r.trust<25?'Robin: „Lass uns die offenen Absprachen klären.“ −1 auf Auftreten-Proben.':'Robin: „Sag Bescheid, bevor eine Abholung kippt.“',r.trust<25?'warn':'info')}<section class="card"><h3>Ersatz im Betriebsteam suchen</h3><p>Einmal je Abholtag ab 40 Zusammenhalt: +12 Kraft, +30 Wasser, +20 Energie vor den Kosten einer Runde.</p>${button('Im Betriebsteam um Unterstützung bitten','support',{},r.phase!=='map'||r.trust<40||r.supported_days.includes(r.day))}</section><h3>Mitmachen im Bezirk</h3><p class="muted">Fairteilen ist kostenlos und bedingungslos. Materialboni sind keine Bezahlung für Lebensmittel.</p><div class="cards">${Object.entries(D.requests).map(([k,q])=>`<section class="card"><h3>${esc(q.title)}</h3><p>${esc(q.text)}</p>${progress(Math.min(q.target,r[q.counter]),q.target,Math.min(q.target,r[q.counter])+'/'+q.target)}<p class="muted">${esc(D.items[q.reward].name)} · +5 Zusammenhalt</p>${r.claimed.includes(k)?'<p>Rückmeldung gegeben; Material erhalten.</p>':button('Rückmeldung geben','claim',{key:k},r.phase!=='map'||r[q.counter]<q.target||G.weight(r)+D.items[q.reward].weight>G.stats(r).capacity)}</section>`).join('')}</div><h3>Deine Gesprächsnotizen</h3><p class="muted">Persönliche Klärung im Spiel, keine Meldung einer Regelverletzung (MRV). Formelle Meldungen bearbeitet grundsätzlich die Lokale Meldungsgruppe (LMG), nicht eine BOT allein.</p>${r.violations.map((v,i)=>`<section class="card"><h3>${esc(v.title)}</h3><p>${esc(v.rule)}</p><small>Abholtag ${v.day} · ${v.resolved?'Gespräch geführt; Notiz bleibt im Spieltagebuch.':'Offen: 8 Energie und eine Runde; +7 Zusammenhalt.'}</small><p>${v.resolved?'':button('Persönliches Gespräch führen','repairIncident',{key:i},r.phase!=='map'||r.energy<11)}</p></section>`).join('')||'<p>Keine offenen Rücksprachen. Würfelpech ist keine Regelverletzung.</p>'}<details><summary>Betriebsteams & Wiki-Begriffe</summary>${Object.entries(r.standing).map(([k,n])=>`<p>${esc(D.businesses[k][0])}: ${n} Abholungen ${n>=2?'· −1 SG beim Weiterarbeiten':''}</p>`).join('')}<p>BOTs koordinieren den Bezirk. BV betreuen Kooperation und Abholtermine mit dem Betriebsteam. Vor der Abholung Betriebs-Besonderheiten, Pinnwand und Teamchat lesen.</p>${source('Botschafter*in')} · ${source('Betriebsverantwortliche*r')} · ${source('Regelverletzungen_-_Konsequenzen_und_Bearbeitung')}</details>`;}
  function sharing(r){const active=r.phase==='map',channel=ui.channel,today=r.hygiene_log.some(e=>e.day===r.day),foods=r.inventory.filter(o=>D.items[o.key].kind==='food');let html=`<h2>Gerettet – und wie geht es weiter?</h2><p>Kostenlos und bedingungslos fairteilen: persönlich, mit einer Abholabsprache über einen Essenskorb oder über den Fairteiler.</p><p class="muted">Alles ist fiktiv. Es wird nichts online veröffentlicht. Eine ungekühlte Runde gilt im Spiel konservativ als längere Unterbrechung der Kühlkette.</p>${!active?alert('Die Fairteilung planst du auf der Routenkarte zwischen zwei Stationen.'):''}<details open><summary>Hygieneplan · Fairteiler am Bezirkstreff</summary><p>Fiktiver Kühlschrank: Temperatur prüfen, ungeeignete Ware entfernen, bei Bedarf reinigen und dokumentieren.</p>${today?alert('Heute dokumentiert: fiktive Messung 5 °C, Kontrolle und Reinigung erledigt.'):''}${button('Fairteiler kontrollieren & Hygieneplan führen','maintain',{},!active||today)}<p class="muted">Wiki: Temperatur täglich ablesen, etwa 5 °C; mindestens alle zwei Tage kontrollieren und bei Bedarf reinigen. Spielaktion: eine Runde.</p>${r.hygiene_log.map(e=>`<p>Abholtag ${e.day}: ${e.temperature} °C (fiktiv), kontrolliert.</p>`).join('')}</details>`;
    if(r.basket){const os=r.inventory.filter(o=>r.basket.uids.includes(o.uid)),ready=r.turn>=r.basket.ready_turn,ok=os.length===r.basket.uids.length&&os.every(o=>G.eligible(r,o,'personal',true,true)[0]);html+=`<section class="card"><h3>Dein reservierter Essenskorb</h3>${os.map(o=>`<p>${esc(D.items[o.key].name)} · ${esc(G.eligible(r,o,'personal',true,true)[1])}</p>`).join('')}<p>${ready?'Eine fiktive Abholperson hat die Übergabe vereinbart.':'Nach einer weiteren Runde meldet sich die fiktive Abholperson. Vorräte altern weiter.'}</p>${button('Eine Runde auf die Abholabsprache warten','basket',{move:'wait'},!active||ready)}<form data-form="basket">${checkbox('checked','Vor dieser Übergabe jedes Stück erneut auf Genießbarkeit geprüft.',true)}${checkbox('conversation','Persönliches Gespräch möglich; nötige Hinweise und verantwortungsvolle Behandlung abgesprochen.',true)}<button class="primary" ${!active||!ready||!ok?'disabled':''}>Essenskorb persönlich übergeben</button></form><p>${button('Fiktiven Essenskorb zurücknehmen','basket',{move:'cancel'},!active)}</p></section>`;}
    return html+`<section class="card"><h3>Übergabe planen</h3><label>Weg der Fairteilung<select data-view="channel">${options(Object.keys(D.channels),channel,D.channels)}</select></label><p class="muted">${channel==='fairteiler'?'Nicht-persönliche Weitergabe: Kühlware braucht eine erhaltene Kühlkette und einen kontrollierten Kühlschrank. Zubereitete warme/kühlbedürftige Speisen sind ausgeschlossen.':'Persönliche Übergabe mit Möglichkeit zum Gespräch, Einzelfallbeurteilung und nötigen Hinweisen.'}</p><form data-form="share"><fieldset><legend>Lebensmittel auswählen</legend>${foods.map(o=>{const [ok,why]=G.eligible(r,o,channel==='basket'?'personal':channel);return `<label class="check"><input type="checkbox" name="uids" value="${o.uid}" ${!ok||!active?'disabled':''}><span>${esc(D.items[o.key].name)}<br><small>${esc(why)}</small></span></label>`;}).join('')||'<p>Keine Lebensmittel im Rucksack.</p>'}</fieldset>${checkbox('checked','Jedes ausgewählte Stück auf Genießbarkeit geprüft.',true)}${channel==='personal'?checkbox('conversation','Persönliche Übergabe, nötige Hinweise und verantwortungsvolle Behandlung abgesprochen.',true):''}<button class="primary" ${!active||channel==='basket'&&r.basket?'disabled':''}>${channel==='basket'?'Fiktiven Essenskorb anlegen':'Kostenlos und bedingungslos fairteilen'}</button></form><small>Eine Runde je Anlage/Übergabe. Erst die Übergabe zählt als fairteilt; +5 Kraft je Posten als Spielbonus.</small></section><details><summary>Abgeschlossene Fairteilungen</summary>${r.distribution_log.map(e=>`<p>Abholtag ${e.day} · ${esc(D.channels[e.channel])}: ${esc(e.names.join(', '))}</p>`).join('')||'<p>Noch keine Übergaben.</p>'}</details>${source('Hygieneregeln')} · ${source('Fairteilung')} · ${source('Fairteiler_und_Abgabestellen')}`;
  }
  function binScene(r){const d=D.bins[r.bin_key];if(r.phase==='bins')return scene(d.icon,d.name)+`<section class="card"><h2>Tonnenrunde · ${esc(d.name)}</h2><p>${esc(d.text)}</p><p class="muted">Fiktive, abgesprochene Sortieraktion mit freigegebenem Material. Keine Lebensmittelbeute.</p><p>Belastung: ${d.dirt} Hygiene, ${d.dust} Staub, ${d.odor} Geruch.</p><p class="muted">Deine Spielboni: Hygieneschutz ${G.bonus(r,'handling')} · Staubschutz ${G.bonus(r,'dust_guard')} · Geruchsschutz ${G.bonus(r,'odor_guard')} · Griff ${G.bonus(r,'grip')}</p>${hint(G.spec(r,'bin'),'Erfolg: zwei Materialangebote; sonst zusätzliche Belastung. Immer eine Runde.')}<div class="actions">${button('Sortieren & Material prüfen','bin',{move:'resolve'},false,'primary')}${button('Station ohne Materialsuche beenden','bin',{move:'leave'})}</div></section>`;
    return scene(d.icon,d.name)+`<section class="card"><h2>Material aus der Tonnenrunde</h2>${alert(r.bin_result)}${result(r)}${r.bin_loot.map((k,i)=>`<div class="card compact"><strong>${esc(D.items[k].name)}</strong><p class="muted">${esc(description(D.items[k]))}</p>${button('Material mitnehmen','bin',{move:'take',index:i},G.weight(r)+D.items[k].weight>G.stats(r).capacity)}</div>`).join('')}${button('Tonnenrunde abschließen','bin',{move:'leave'},false,'primary')}</section>`;}
  function bins(r){if(['bins','bin_loot'].includes(r.phase))return binScene(r);return `<h2>Acht Sammelplätze für die Tonnenrunde</h2><p>Eine freiwillige Station statt der nächsten Abholung. Vorher Handschuhe, Maske und Schuhe passend wählen. Die Runde zählt nicht als Lebensmittelabholung.</p><div class="cards">${Object.entries(D.bins).map(([k,b])=>`<section class="card"><h3>${b.icon} ${esc(b.name)}</h3><p>${esc(b.text)}</p><p class="muted">SG ${b.dc} · ${esc(D.attributes[b.stat])} · Hygiene ${b.dirt} / Staub ${b.dust} / Geruch ${b.odor}</p>${button('Diesen Sammelplatz aufsuchen','chooseBin',{key:k},r.phase!=='map'||r.day===5&&r.step===3)}</section>`).join('')}</div>`;}
  function codexCards(){const list=Object.entries(D.items).filter(([k,d])=>(ui.codexCategory==='all'||d.kind===ui.codexCategory)&&(ui.codexRarity==='all'||d.rarity===ui.codexRarity)&&d.name.toLocaleLowerCase('de').includes(ui.codexSearch.toLocaleLowerCase('de')));return `<p class="muted" id="codex-count">${list.length} Treffer</p><div class="cards">${list.map(([k,d])=>`<article class="card item"><div class="title">${rarity[d.rarity]} ${esc(d.name)}</div><p>${esc(D.flavour[k])}</p><small>${esc(kinds[d.kind])} · ${d.rarity} · Gewicht ${d.weight}<br>${esc(description(d))}</small></article>`).join('')}</div>`;}
  function codex(){return `<h2>${Object.keys(D.items).length} Fundstücke für deinen Run</h2><div class="filters three"><label>Kategorie<select data-view="codexCategory">${options(['all',...Object.keys(kinds)],ui.codexCategory,{all:'Alle',...kinds})}</select></label><label>Seltenheit<select data-view="codexRarity">${options(['all',...Object.keys(rarity)],ui.codexRarity,{all:'Alle'})}</select></label><label>Im Item-Lexikon suchen<input type="search" data-view="codexSearch" value="${esc(ui.codexSearch)}"></label></div><div id="codex-list">${codexCards()}</div>`;}
  function arena(){const d=state.duel;if(!d)return `<h2>PvP · Zwei Menschen, ein Bildschirm</h2><p>Nach der Tour spielt ihr einen freiwilligen Abhol-Parcours am Treff. Gleiche Ausrüstung, abwechselnde Züge auf diesem Gerät. Das Duell verändert deine Rettungstour nicht.</p><form class="card" data-form="newDuel"><div class="grid2">${field('player-a','Spieler 1','Sam','text','maxlength="30"')}${field('player-b','Spieler 2','Hannes','text','maxlength="30"')}</div><label>Gleiches Parcoursgerät für beide<select name="weapon">${options(Object.keys(D.items).filter(k=>D.items[k].kind==='weapon'),'baguette',Object.fromEntries(Object.entries(D.items).map(([k,v])=>[k,v.name])))}</select></label><button class="primary">Hotseat-Duell starten</button></form>`;
    const a=d.players[d.turn];return `<h2>PvP · Hotseat-Parcours</h2><div class="grid2">${d.players.map(p=>`<section class="card"><h3>${esc(p.name)}</h3>${progress(p.hp,100,p.hp+'/100 Kondition')}<p>${esc(D.items[p.weapon].name)}</p><small>Ausdauer ${p.stamina}/40 · ${p.potions} Versorgungspausen · ${p.guard?'abgesichert':'kein Block'}</small></section>`).join('')}</div>${d.winner!==null?alert(d.players[d.winner].name+' gewinnt das Duell!'):alert(a.name+' ist am Zug. Danach Gerät weitergeben.')}<div class="actions">${[['attack','PvP: Tempo machen'],['heavy','PvP: Sprinten'],['defend','PvP: Absichern'],['heal','PvP: Versorgungspause']].map(([move,text])=>button(text,'duel',{move},d.winner!==null||move==='heavy'&&a.stamina<12||move==='heal'&&!a.potions)).join('')}</div><p class="muted">Tempo: +3 Ausdauer. Sprint: −12, ×1,7 Druck. Absichern: 12 weniger Konditionsverlust, +10 Ausdauer. Versorgungspause: +24 Kondition, zweimal pro Duell.</p><div class="log">${d.log.map(x=>`<p>${esc(x)}</p>`).join('')}</div>${button('Duell zurücksetzen','resetDuel')}`;}
  function learner(){const l=state.learn;let h='<h2>Dein Weg zum Foodsaver</h2><p class="muted">Ein inoffizielles Lernabenteuer. Es ersetzt weder das offizielle Quiz noch Einführungsabholungen oder die echte Verifizierung.</p>';
    if(l.stage==='intro')return h+scene('🚲','Deine Nachbarschaft · kurz vor Ladenschluss')+`<form class="card" data-form="learnStart"><h3>Ein Rucksack voller Möglichkeiten</h3><p>„Zu gut für die Tonne“, sagt Sam aus dem lokalen Team. „Willst du lernen, wie wir gemeinsam Lebensmittel retten?“</p>${field('learn-name','Wie sollen wir dich nennen?',l.name,'text','maxlength="30"')}<button class="primary">Mein Abenteuer beginnen</button></form>`;
    if(l.stage==='quiz'||l.stage==='pickup'){const quiz=l.stage==='quiz',q=quiz?D.learning.QUIZ[l.quiz]:D.learning.PICKUPS[l.pickup],title=quiz?q[0]:q.title,question=quiz?q[1]:q.question,answers=quiz?q[2]:q.options,src=quiz?q[5]:q.source;return h+scene(quiz?'📖':q.icon,quiz?`Lernstation ${l.quiz+1}/3`:`Einführungsabholung ${l.pickup+1}/3`)+`<section class="card"><h3>${esc(title)}</h3>${quiz?'':`<p>${esc(q.story)}</p>`}<p><strong>${esc(question)}</strong></p><div class="actions">${answers.map((text,index)=>button(text,'learn',{move:'answer',index},l.answered)).join('')}</div>${l.feedback?alert(l.feedback,l.answered?'':'warn'):''}${source(src)}${l.answered?`<p>${quiz?'':esc(q.result)+'<br>'+esc(q.loot.join(', '))}</p>${button(quiz?'Weiter':'Lebensmittel teilen & Tour abschließen','learn',{move:'next'},false,'primary')}`:''}</section>`;}
    if(l.stage==='agreement')return h+`<form class="card" data-form="learnAgree"><h3>Retten heißt Verantwortung übernehmen</h3><p>Im echten Werdegang folgen auf das Quiz die Rechtsvereinbarung und mindestens drei begleitete Einführungsabholungen. Hier bestätigst du nur einen Spielhinweis; keine Rechtsvereinbarung und keine persönlichen Dokumente.</p>${checkbox('ack','Verstanden: Dies ist eine Simulation.',true)}<button class="primary">Zur ersten Einführungsabholung</button></form>`;
    if(l.stage==='verification')return h+`<section class="card"><h3>Bereit für den nächsten Schritt</h3><p>Im echten Leben werden Eignung, Profildaten und Foto geprüft. Das Vorzeigen eines Ausweisdokuments reicht; eine Kopie darf nicht gefordert werden. Es können zusätzliche Einführungsabholungen nötig sein.</p>${source('Foodsaver')}<p>${button('Kapitel abschließen','learn',{move:'finish'},false,'primary')}</p></section>`;
    return h+scene('🧺','Gemeinsam bleibt mehr übrig')+`<section class="card"><h3>${esc(l.name)}, du hast den Lernweg durchgespielt.</h3><p>Drei Lernfragen, drei begleitete Spieltouren und ${l.mistakes} Lernversuche mit Hinweis.</p>${source('Foodsaver')}<p>${button('Lernabenteuer zurücksetzen','resetLearn')}</p></section>`;
  }
  function render(){const r=state.run,tab=tabs[state.prefs.tab]?state.prefs.tab:'route';document.body.classList.toggle('reduced',!state.prefs.motion);const creationPage=r.phase==='creation'&&!['learn','arena','codex'].includes(tab);
    const content=creationPage?creation(r):({route:()=>route(r),bag:()=>bag(r),sharing:()=>sharing(r),district:()=>district(r),bins:()=>bins(r),codex,arena,learn:learner}[tab])();
    $('#app').innerHTML=`<div class="shell"><aside class="sidebar"><details class="mobile-menu" ${matchMedia('(min-width:851px)').matches?'open':''}><summary>🥕 Menü & Spielstand</summary><h2>Dein Rettungsrucksack</h2><p class="muted">Fünf Abholtage. Ein Bezirk. Sam zählt auf deine Runde.</p><nav aria-label="Spielbereiche">${Object.entries(tabs).map(([k,label])=>`<button type="button" data-nav="${k}" ${k===tab?'aria-current="page"':''} class="${k===tab?'active':''}">${label}</button>`).join('')}</nav><div class="settings"><label class="check"><input type="checkbox" data-pref="sound" ${state.prefs.sound?'checked':''}><span>Sounds einschalten</span></label><label class="check"><input type="checkbox" data-pref="motion" ${state.prefs.motion?'checked':''}><span>Animationen</span></label>${button('Erfolgston testen','sound',{},false,'small')}</div><div class="divider"></div><p class="muted">${storageOK?'Spielstand wird automatisch lokal gespeichert.':esc(storageMessage)}</p><div class="utilities">${button('Spielstand exportieren','export',{},false,'small')}${button('Spielstand importieren','import',{},false,'small')}</div><details><summary>Neue Tour / Seed</summary><form data-form="newSeed">${field('seed','Seed',r.seed,'number','min="0" max="4294967295" step="1" required')}${checkbox('ack','Laufenden Run verwerfen',true)}<button class="danger">Tour mit diesem Seed starten</button></form><small>Browser und Python verwenden unterschiedliche Zufallsgeneratoren. Gleicher Browser-Seed und gleiche Entscheidungen reproduzieren die Browser-Tour.</small></details><details><summary>Run-Tagebuch</summary><div class="log">${r.log.slice(-25).reverse().map(x=>`<p>${esc(x)}</p>`).join('')}</div></details><details><summary>Regeln & Quellen</summary><p>Wiki-Regeln gelten unabhängig von Würfelwürfen. Zahlen, Ausrüstung, Verdauung und Zusammenhalt sind fiktive Spielmechanik.</p>${['Hauptseite','Foodsaver','Verhaltensregeln','Hygieneregeln','Fairteilung','Fairteiler_und_Abgabestellen','Botschafter*in','Betriebsverantwortliche*r'].map(x=>`<p>${source(x)}</p>`).join('')}</details></details></aside><main><header><div class="eyebrow">Die Abholrunde · Zwischen Kanal und Nordtor</div><h1>Operation: Feierabend</h1><p class="muted">Roguelike · Lebensmittel retten und fairteilen · Lokales Hotseat-PvP</p></header>${storageMessage?alert(storageMessage,'warn'):''}${content}<footer>Inoffizielles foodsharing-Text-RPG · Alles bleibt auf diesem Gerät. Keine echten Abholtermine, Meldungen oder Veröffentlichungen. AGPL-3.0.</footer></main></div>`;
  }
  let audioContext;
  function chime(){try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();const now=audioContext.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=now+i*.11;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.10);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.11);});}catch(e){notice('Der Browser konnte den Ton nicht abspielen.');}}
  function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function execute(action,p={}){try{let ok=true;if(action==='export'){download('fairteiler-spielstand.json',JSON.stringify(state,null,2),'application/json');return;}if(action==='import'){$('#import-file').click();return;}if(action==='diary'){download('rettungsrun-'+state.run.seed+'.txt',state.run.log.join('\n'),'text/plain');return;}if(action==='sound'){chime();return;}
      if(action==='newRun'){if(!confirm('Laufenden Run verwerfen und eine neue Tour beginnen?'))return;state.run=G.newRun(p.seed??seed());state.prefs.tab='route';writeAllowed=true;storageMessage='';}
      else if(action==='newDuel')state.duel=G.newDuel(p.a,p.b,p.weapon);
      else if(action==='duel')ok=state.duel&&G.duel(state.duel,p.move);
      else if(action==='resetDuel'){if(!confirm('Lokales Duell zurücksetzen?'))return;state.duel=null;}
      else if(action==='resetLearn'){if(!confirm('Lernabenteuer zurücksetzen?'))return;state.learn=G.newLearner();}
      else if(action==='learn')ok=G.learn(state.learn,p.move,p);
      else{if(action==='reroll'){ui.name=$('#character-name')?.value||ui.name;ui.background=$('#background')?.value||ui.background;}ok=G.act(state.run,action,p);}
      if(!ok){notice('Diese Aktion ist gerade nicht möglich. Prüfe Voraussetzungen und Rucksack.');return;}
      if(['visit','chooseBin'].includes(action))state.prefs.tab='route';save();render();if(state.prefs.sound&&!['equip','unequip','drop'].includes(action))chime();
    }catch(e){console.error(e);notice('Aktion konnte nicht abgeschlossen werden: '+e.message);}}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){state.prefs.tab=nav.dataset.nav;save();render();window.scrollTo(0,0);return;}const b=e.target.closest('button[data-action]');if(b&&!b.disabled)execute(b.dataset.action,JSON.parse(b.dataset.payload||'{}'));});
  document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pref){state.prefs[el.dataset.pref]=el.checked;save();document.body.classList.toggle('reduced',!state.prefs.motion);if(el.dataset.pref==='sound'&&el.checked)chime();return;}const key=el.dataset.view;if(!key||['bagSearch','codexSearch'].includes(key))return;ui[key]=el.value;if(key==='background')ui.name=$('#character-name')?.value||ui.name;render();});
  document.addEventListener('input',e=>{const key=e.target.dataset.view;if(!['bagSearch','codexSearch'].includes(key))return;ui[key]=e.target.value;if(key==='bagSearch')$('#inventory-list').innerHTML=inventoryCards(state.run);else $('#codex-list').innerHTML=codexCards();});
  document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const f=new FormData(form),bool=k=>f.has(k),ids=()=>f.getAll('uids').map(Number);switch(form.dataset.form){case 'confirm':execute('confirm',{name:f.get('character-name'),background:f.get('background')});break;case 'prepare':execute('prepare',{response:f.get('response'),papers:bool('papers'),notes:bool('notes'),containers:bool('containers'),hands:bool('hands')});break;case 'incident':execute('incident',{choice:'bad',ack:bool('ack')});break;case 'share':execute('share',{channel:ui.channel,uids:ids(),checked:bool('checked'),conversation:bool('conversation')});break;case 'basket':execute('basket',{move:'deliver',checked:bool('checked'),conversation:bool('conversation')});break;case 'newSeed':if(bool('ack'))execute('newRun',{seed:Number(f.get('seed'))});break;case 'newDuel':execute('newDuel',{a:f.get('player-a'),b:f.get('player-b'),weapon:f.get('weapon')});break;case 'learnStart':execute('learn',{move:'start',name:f.get('learn-name')});break;case 'learnAgree':execute('learn',{move:'agree',ack:bool('ack')});break;}});
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2_000_000)throw new Error('Spielstand ist zu groß.');const imported=G.validate(JSON.parse(await file.text()));state=imported;writeAllowed=true;ui={...ui,bagSearch:'',codexSearch:''};storageMessage='';save();render();notice('Spielstand importiert.');}catch(err){notice('Import abgelehnt: '+err.message);}finally{e.target.value='';}});
  save();render();
})();
</script>
</body>
</html>
